name: CI
on:
  push: { branches: [main, develop] }
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          {
            MYSQL_ROOT_PASSWORD: root,
            MYSQL_USER: sms,
            MYSQL_PASSWORD: sms,
            MYSQL_DATABASE: sms_test,
          }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot" --health-interval=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Grant test user rights to create/drop the test database
        run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'sms'@'%'; FLUSH PRIVILEGES;"
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Migration drift check (schema.ts must match committed migrations)
        run: npx drizzle-kit check && npx drizzle-kit generate --name ci_drift_check && test -z "$(git status --porcelain -- drizzle)"
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Build the container image
        run: docker build -t edusphere-api:ci .
